<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Textured Artworks — Pure Code Illustrations</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --card: #ffffff;
      --ink: #1b1d21;
      --muted: #6c6761;
      --border: #e5dfd6;
      --accent: #14698a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    header {
      max-width: 1240px;
      margin: 0 auto;
      padding: 40px 24px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
    }
    button:hover {
      border-color: var(--accent);
    }
    button:active {
      transform: translateY(1px);
    }
    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 12px 24px 64px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(20, 18, 15, 0.04);
      display: flex;
      flex-direction: column;
    }
    .canvas-wrap {
      aspect-ratio: 1 / 1;
      background: #fdfcfb;
      cursor: zoom-in;
      border-bottom: 1px solid var(--border);
    }
    .canvas-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .meta {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .meta h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .meta p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    .swatches {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(18, 18, 20, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 50;
    }
    .modal.open {
      display: flex;
    }
    .modal-inner {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      max-width: min(92vh, 920px);
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-inner canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .modal-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Textured Artworks</h1>
      <p class="subtitle">Pure procedural JavaScript Canvas 2D illustrations &mdash; colored pencil, dry-brush ink &amp; chalk pastel (zero external libraries)</p>
    </div>
    <div class="actions">
      <button id="reseedBtn">Re-seed Texture</button>
    </div>
  </header>

  <main id="grid"></main>

  <div class="modal" id="modal">
    <div class="modal-inner">
      <div class="modal-bar">
        <div>
          <strong id="modalTitle"></strong>
          <span id="modalCat" style="color: var(--muted); font-size: 13px; margin-left: 8px;"></span>
        </div>
        <div class="actions">
          <button id="modalDownload">Download PNG</button>
          <button id="modalClose">Close</button>
        </div>
      </div>
      <canvas id="modalCanvas" width="1200" height="1200"></canvas>
    </div>
  </div>

  <script type="module">
    import { ARTWORKS } from './src/registry.js';

    const grid = document.getElementById('grid');
    const modal = document.getElementById('modal');
    const modalCanvas = document.getElementById('modalCanvas');
    const modalTitle = document.getElementById('modalTitle');
    const modalCat = document.getElementById('modalCat');
    const modalDownload = document.getElementById('modalDownload');
    const modalClose = document.getElementById('modalClose');

    let seedOffset = 0;
    let activeArtwork = null;

    function downloadCanvas(canvas, filename) {
      const a = document.createElement('a');
      a.download = filename + '.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

    function renderAll() {
      grid.innerHTML = '';
      ARTWORKS.forEach((art, idx) => {
        const card = document.createElement('article');
        card.className = 'card';

        const wrap = document.createElement('div');
        wrap.className = 'canvas-wrap';
        const canvas = document.createElement('canvas');
        canvas.width = 1200;
        canvas.height = 1200;
        wrap.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        art.draw(ctx, 1200, 1200, (idx + 1) * 101 + seedOffset);

        wrap.addEventListener('click', () => {
          activeArtwork = { art, idx };
          modalTitle.textContent = art.title;
          modalCat.textContent = art.category;
          const mctx = modalCanvas.getContext('2d');
          mctx.clearRect(0, 0, 1200, 1200);
          art.draw(mctx, 1200, 1200, (idx + 1) * 101 + seedOffset);
          modal.classList.add('open');
        });

        const meta = document.createElement('div');
        meta.className = 'meta';

        const info = document.createElement('div');
        info.innerHTML = `<h2>${art.title}</h2><p>${art.category} &middot; ${art.medium}</p>`;
        const swatches = document.createElement('div');
        swatches.className = 'swatches';
        art.palette.forEach((hex) => {
          const s = document.createElement('span');
          s.className = 'swatch';
          s.style.background = hex;
          swatches.appendChild(s);
        });
        info.appendChild(swatches);

        const dlBtn = document.createElement('button');
        dlBtn.textContent = 'PNG';
        dlBtn.addEventListener('click', () => downloadCanvas(canvas, art.id));

        meta.appendChild(info);
        meta.appendChild(dlBtn);
        card.appendChild(wrap);
        card.appendChild(meta);
        grid.appendChild(card);
      });
    }

    document.getElementById('reseedBtn').addEventListener('click', () => {
      seedOffset += 37;
      renderAll();
    });

    modalClose.addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('open');
    });
    modalDownload.addEventListener('click', () => {
      if (activeArtwork) downloadCanvas(modalCanvas, activeArtwork.art.id);
    });

    renderAll();
  </script>
</body>
</html>
